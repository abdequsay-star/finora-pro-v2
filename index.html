<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finora Pro V2</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#081628;color:#e5f5ff;margin:0}header{padding:24px;background:#12243a;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}h1{color:#2cdbd1;margin:0}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#142940;border:1px solid #31516c;border-radius:16px;padding:20px}.wide{grid-column:span 2}button,input,select{padding:12px;border:1px solid #37546b;border-radius:9px;background:#203b52;color:white}button{cursor:pointer}.primary{background:#1ccbc0;color:#061a29}input,select{width:100%;margin:5px 0 14px}label{display:block}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #36516a;text-align:left}.scroll{overflow:auto}.muted{color:#a5bbcd}.value{font-size:30px;font-weight:bold;color:#25d8c8}nav{display:flex;gap:8px;flex-wrap:wrap}.bar{height:10px;background:#34506b;border-radius:10px;overflow:hidden}.bar span{height:100%;display:block;background:#1dd0c6}@media(max-width:750px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{header,form,button{display:none!important}}header{position:sticky;top:0;z-index:2;box-shadow:0 8px 28px #0003}.card{box-shadow:0 8px 30px #0002}button:hover{filter:brightness(1.16)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #24d6ca;outline-offset:2px}.chart{width:100%;height:auto;display:block}.chart text{fill:#a5bbcd;font-size:11px}.pill{font-size:12px;border:1px solid #2a6371;padding:5px 9px;border-radius:99px;color:#25d8c8}.two{display:flex;justify-content:space-between;align-items:center;gap:12px}.positive{color:#25d8c8}.negative{color:#ff9696}@media(max-width:750px){header{position:static}main{padding:14px}.card{padding:16px}}@media print{body{background:white;color:black}.card{background:white;color:black;border-color:#aaa;box-shadow:none}.value{color:black}}</style><header><h1>◈ Finora Pro V2</h1><nav id="nav"></nav><span id="status">Local</span></header><main><p id="message"></p><div id="app"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase?.createClient('https://yghaabkasuttydaheehy.supabase.co','sb_publishable_PBgnfZD6uk9lT_TAleQT9w_QKUtOH30');let user=null,page='Dashboard';let data=JSON.parse(localStorage.getItem('finora_v2')||'{"transactions":[],"budgets":{},"goals":[]}');const money=n=>new Intl.NumberFormat('fr-MA').format(n||0)+' DH',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=(type)=>data.transactions.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount),0);function msg(s){document.querySelector('#message').textContent=s}async function save(){localStorage.setItem('finora_v2',JSON.stringify(data));render();if(user){let {error}=await client.from('finance_data').upsert({user_id:user.id,payload:data,updated_at:new Date().toISOString()});document.querySelector('#status').textContent=error?'Sync error':'☁ Synchronisé';if(error)msg(error.message)}}async function load(){if(!user)return;let {data:rows,error}=await client.from('finance_data').select('payload').eq('user_id',user.id);if(error)return msg(error.message);if(rows.length){data=rows[0].payload;localStorage.setItem('finora_v2',JSON.stringify(data))}else await save();render()}function change(p){page=p;render()}function render(){document.querySelector('#nav').innerHTML=['Dashboard','Transactions','Budget','Épargne','Rapports','Compte'].map(x=>'<button class="'+(page===x?'primary':'')+'" onclick="change(\''+x+'\')">'+x+'</button>').join('');document.querySelector('#app').innerHTML=({Dashboard:dash,Transactions:transactions,Budget:budget,'Épargne':savings,Rapports:reports,Compte:account})[page]()}function chart(kind){let months=Array.from({length:12},(_,i)=>data.transactions.filter(t=>t.type===kind&&Number(t.date?.slice(5,7))===i+1&&t.date?.startsWith(String(new Date().getFullYear()))).reduce((a,t)=>a+Number(t.amount),0));let max=Math.max(1,...months),points=months.map((v,i)=>[30+i*49,176-v/max*145]);return '<svg class="chart" viewBox="0 0 610 215" role="img" aria-label="Évolution mensuelle '+kind+'"><line x1="20" y1="177" x2="585" y2="177" stroke="#3a5973"/><path d="'+points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ')+'" stroke="#20d7cb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+points.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#20d7cb"><title>'+money(months[i])+'</title></circle><text x="'+p[0]+'" y="199" text-anchor="middle">'+['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'][i]+'</text>').join('')+'</svg>'}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='finora-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importBackup(input){let file=input.files?.[0];if(!file)return;file.text().then(t=>{let x=JSON.parse(t);if(!Array.isArray(x.transactions)||!x.budgets||!Array.isArray(x.goals))throw Error('Format incorrect');if(!confirm('Remplacer les données actuelles par ce backup ?'))return;data=x;save();msg('Backup importé')}).catch(e=>msg(e.message))}function dash(){let inc=sum('income'),out=sum('expense');return '<div class="grid"><div class="card"><h3>Revenus</h3><div class="value">'+money(inc)+'</div></div><div class="card"><h3>Dépenses</h3><div class="value">'+money(out)+'</div></div><div class="card"><h3>Solde</h3><div class="value">'+money(inc-out)+'</div></div><div class="card wide"><h3>Dépenses par catégorie</h3>'+Object.entries(data.transactions.filter(x=>x.type==='expense').reduce((a,x)=>(a[x.category]=(a[x.category]||0)+Number(x.amount),a),{})).map(([c,v])=>'<p>'+esc(c)+' — '+money(v)+'</p><div class="bar"><span style="width:'+Math.min(100,v/Math.max(1,out)*100)+'%"></span></div>').join('')+'</div><div class="card"><h3>Actions rapides</h3><button class="primary" onclick="change(\'Transactions\')">+ Transaction</button></div><div class="card wide"><h3>Évolution des dépenses — 12 mois</h3>'+chart('expense')+'</div><div class="card"><h3>Évolution des revenus — 12 mois</h3>'+chart('income')+'</div></div>'}function transactions(){return '<div class="grid"><div class="card"><h3>Nouvelle transaction</h3><form id="transaction"><label>Type</label><select name="type"><option value="expense">Dépense</option><option value="income">Revenu</option></select><label>Description</label><input name="title" required><label>Montant MAD</label><input name="amount" type="number" min=".01" step=".01" required><label>Catégorie</label><select name="category">'+['Salaire','Logement','Alimentation','Transport','Factures','Santé','Shopping','Autre'].map(x=>'<option>'+x+'</option>').join('')+'</select><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required><button class="primary">Ajouter</button></form></div><div class="card wide scroll"><h3>Historique</h3><table><tr><th>Date</th><th>Description</th><th>Catégorie</th><th>Montant</th><th></th></tr>'+data.transactions.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount)+'</td><td><button onclick="del(\''+x.id+'\')">×</button></td></tr>').join('')+'</table></div></div>'}function budget(){return '<div class="grid"><div class="card"><h3>Budgets mensuels (MAD)</h3><form id="budget">'+['Logement','Alimentation','Transport','Factures','Santé','Shopping','Autre'].map(c=>'<label>'+c+'</label><input type="number" min="0" name="'+c+'" value="'+(data.budgets[c]||0)+'">').join('')+'<button class="primary">Enregistrer</button></form></div><div class="card wide"><h3>Budget vs dépenses</h3>'+Object.entries(data.budgets).map(([c,b])=>{let used=data.transactions.filter(x=>x.category===c&&x.type==='expense'&&x.date.slice(0,7)===new Date().toISOString().slice(0,7)).reduce((s,x)=>s+Number(x.amount),0);return '<p>'+esc(c)+': '+money(used)+' / '+money(b)+'</p><div class="bar"><span style="width:'+Math.min(100,b?used/b*100:0)+'%"></span></div>'}).join('')+'</div></div>'}function savings(){return '<div class="grid"><div class="card"><h3>Objectif d’épargne</h3><form id="goal"><label>Nom</label><input name="title" required><label>Cible</label><input name="target" type="number" min="1" required><label>Épargné</label><input name="saved" type="number" min="0" value="0" required><button class="primary">Ajouter</button></form></div><div class="card wide"><h3>Mes objectifs</h3>'+data.goals.map(g=>'<p>'+esc(g.title)+' — '+money(g.saved)+' / '+money(g.target)+'</p><div class="bar"><span style="width:'+Math.min(100,g.saved/g.target*100)+'%"></span></div><p><button onclick="addSaving(\''+g.id+'\')">+ Épargner</button></p>').join('')+'</div></div>'}function reports(){return '<div class="card"><h3>Rapport financier</h3><p>Revenus: '+money(sum('income'))+'</p><p>Dépenses: '+money(sum('expense'))+'</p><p>Solde: '+money(sum('income')-sum('expense'))+'</p><button class="primary" onclick="print()">Exporter PDF</button> <button onclick="exportCSV()">Exporter Excel (CSV)</button></div>'}function account(){return '<div class="card" style="max-width:520px"><h3>Compte Supabase</h3>'+(user?'<p>'+esc(user.email)+'</p><button onclick="logout()">Déconnexion</button>':'<form id="auth"><label>Email</label><input type="email" name="email" required><label>Mot de passe</label><input type="password" name="password" minlength="6" required><button class="primary" name="mode" value="login">Connexion</button> <button name="mode" value="signup">Créer compte</button></form>')+'<p class="muted">Les données locales sont conservées sur cet appareil; la connexion synchronise avec votre compte.</p><button onclick="backup()">Télécharger une sauvegarde JSON</button><p><label>Importer une sauvegarde</label><input type="file" accept=".json,application/json" onchange="importBackup(this)"></p></div>'}function del(id){if(confirm('Supprimer?')){data.transactions=data.transactions.filter(x=>x.id!==id);save()}}function addSaving(id){let n=Number(prompt('Montant à ajouter'));if(n>0){data.goals.find(x=>x.id===id).saved+=n;save()}}async function logout(){await client.auth.signOut();user=null;render()}function exportCSV(){let csv='\ufeffDate;Type;Description;Categorie;Montant\n'+data.transactions.map(x=>[x.date,x.type,'"'+x.title.replaceAll('"','""')+'"',x.category,x.amount].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='finora-report.csv';a.click()}document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='transaction'){data.transactions.push({...v,id:crypto.randomUUID(),amount:Number(v.amount)});save()}if(f.id==='budget'){data.budgets=Object.fromEntries(Object.entries(v).map(([k,n])=>[k,Number(n)]));save()}if(f.id==='goal'){data.goals.push({id:crypto.randomUUID(),title:v.title,target:Number(v.target),saved:Number(v.saved)});save()}if(f.id==='auth'){try{let r=e.submitter.value==='signup'?await client.auth.signUp({email:v.email,password:v.password}):await client.auth.signInWithPassword({email:v.email,password:v.password});if(r.error)throw r.error;if(r.data.session){user=r.data.user;await load()}else msg('Confirme ton email avant de te connecter')}catch(err){msg(err.message)}}});render();if(client)client.auth.getUser().then(async r=>{if(r.data.user){user=r.data.user;await load()}});</script></html>
