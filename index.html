te+' %':'—')+'</strong></article></div><div class="insights-columns"><section class="insights-panel"><h3>◉ Dépenses par catégorie</h3><p>Répartition des dépenses de ce mois</p>'+(cats.length?cats.map(([name,value],i)=>'<div class="insights-category"><div><strong>'+esc(name)+'</strong><span>'+money(value)+' · '+Math.round(value/Math.max(1,expense)*100)+' %</span></div><div class="insights-track"><i style="width:'+Math.min(100,value/Math.max(1,expense)*100)+'%;background:'+['#24cfff','#ffba52','#ae7bff','#25dfb2','#ff5889'][i%5]+'"></i></div></div>').join(''):'<p class="insights-empty">Aucune dépense enregistrée ce mois.</p>')+'</section><section class="insights-panel"><h3>▥ Comparaison mensuelle</h3><p>Évolution par rapport au mois précédent</p><div class="insights-compare"><div><small>Mois précédent</small><strong>'+money(prevExpense)+'</strong></div><div><small>Ce mois</small><strong>'+money(expense)+'</strong></div></div><div class="insights-difference">'+(diff===null?'Pas de dépenses le mois précédent':(diff>0?'↗ +':diff<0?'↘ ':'')+diff+' % de dépenses vs mois précédent')+'</div><h3 class="insights-subheading">⚑ Alertes budget</h3>'+(alerts.length?alerts.map(a=>'<div class="insights-alert">'+esc(a.name)+' · '+Math.round(a.spent/a.limit*100)+' % du budget utilisé</div>').join(''):'<p class="insights-empty">Aucune alerte budgétaire ce mois.</p>')+'</section></div><section class="insights-panel insights-advice"><h3>✦ Conseils personnalisés</h3>'+tips.map(t=>'<p>✧ '+esc(t)+'</p>').join('')+'</section></div>'}function account(){return '<div class="card" style="max-width:520px"><h3>Compte Supabase</h3>'+(user?'<p>'+esc(user.email)+'</p><button onclick="logout()">Déconnexion</button>':'<form id="auth"><label>Email</label><input type="email" name="email" required><label>Mot de passe</label><input type="password" name="password" minlength="6" required><button class="primary" name="mode" value="login">Connexion</button> <button name="mode" value="signup">Créer compte</button></form>')+'<p class="muted">Les données locales sont conservées sur cet appareil; la connexion synchronise avec votre compte.</p><button onclick="backup()">Télécharger une sauvegarde JSON</button><p><label>Importer une sauvegarde</label><input type="file" accept=".json,application/json" onchange="importBackup(this)"></p></div>'}function del(id){if(confirm('Supprimer?')){data.transactions=data.transactions.filter(x=>x.id!==id);save()}}function addSaving(id){let n=Number(prompt('Montant à ajouter'));if(n>0){data.goals.find(x=>x.id===id).saved+=n;save()}}async function logout(){await client.auth.signOut();user=null;render()}function exportCSV(){let csv='\ufeffDate;Type;Description;Categorie;Montant\n'+data.transactions.map(x=>[x.date,x.type,'"'+x.title.replaceAll('"','""')+'"',x.category,x.amount].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='finora-report.csv';a.click()}document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='transaction'){if(v.editId){const t=data.transactions.find(t=>String(t.id)===v.editId);if(t)Object.assign(t,{type:v.type,title:v.title,amount:Number(v.amount),category:v.category,date:v.date});}else data.transactions.push({type:v.type,title:v.title,amount:Number(v.amount),category:v.category,date:v.date,id:crypto.randomUUID()});transactionSearch='';save()}if(f.id==='budget'){data.budgets=Object.fromEntries(Object.entries(v).map(([k,n])=>[k,Number(n)]));save()}if(f.id==='credit'){if(Number(v.paid)>Number(v.total)){msg('Le montant remboursé ne peut pas dépasser le total');return}data.credits??=[];if(v.editId){const c=data.credits.find(x=>String(x.id)===v.editId);if(c)Object.assign(c,{title:v.title,total:Number(v.total),paid:Number(v.paid),monthly:Number(v.monthly),due:v.due})}else data.credits.push({id:crypto.randomUUID(),title:v.title,total:Number(v.total),paid:Number(v.paid),monthly:Number(v.monthly),due:v.due});save();msg(v.editId?'Crédit modifié':'Crédit ajouté')}if(f.id==='goal'){data.goals.push({id:crypto.randomUUID(),title:v.title,target:Number(v.target),saved:Number(v.saved)});save()}if(f.id==='auth'){try{let r=e.submitter.value==='signup'?await client.auth.signUp({email:v.email,password:v.password}):await client.auth.signInWithPassword({email:v.email,password:v.password});if(r.error)throw r.error;if(r.data.session){user=r.data.user;await load()}else msg('Confirme ton email avant de te connecter')}catch(err){msg(err.message)}}});render();if(client)client.auth.getUser().then(async r=>{if(r.data.user){user=r.data.user;await load()}});</script></html>
