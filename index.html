se)+'</strong></div><div class="summary-line"><span>Reste du mois</span><strong>'+money(income-expense)+'</strong></div><div class="summary-line"><span>Taux d’épargne</span><strong>'+ratio+'%</strong></div><div class="bar"><span style="width:'+Math.max(0,Math.min(100,ratio))+'%"></span></div><p class="muted">Basé sur les transactions du mois.</p></section><section class="card wide"><h3>Dépenses par catégorie · ce mois</h3>'+categoryDonut(ranked,expense)+'</section><section class="card"><h3>Budget & alertes</h3><div class="summary-line"><span>Budget prévu</span><strong>'+money(budgetTotal)+'</strong></div><div class="summary-line"><span>Utilisé ce mois</span><strong>'+money(expense)+'</strong></div><div class="bar"><span style="width:'+Math.min(100,budgetTotal?expense/budgetTotal*100:0)+'%;background:'+(budgetTotal&&expense>budgetTotal?'#ff8e94':'#1dd0c6')+'"></span></div><p class="'+(budgetTotal&&expense>budgetTotal?'negative':'muted')+'">'+(!budgetTotal?'Configurez vos budgets pour activer le suivi.':expense>budgetTotal?'Attention : budget global dépassé.':'Reste disponible : '+money(budgetTotal-expense))+'</p><button onclick="change(\'Budget\')">Gérer le budget →</button></section><section class="card wide"><div class="two"><h3>Dernières transactions</h3><button onclick="change(\'Transactions\')">Voir tout →</button></div>'+(recent.length?'<div class="scroll"><table><tr><th>Date</th><th>Opération</th><th>Catégorie</th><th>Montant</th></tr>'+recent.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.title)+'</td><td>'+esc(t.category)+'</td><td class="'+(t.type==='income'?'positive':'negative')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</td></tr>').join('')+'</table></div>':'<p class="muted">Aucune transaction pour le moment.</p>')+'</section><section class="card"><h3>Objectifs d’épargne</h3>'+(goals.length?goals.slice(0,4).map(g=>'<div class="summary-line"><span>'+esc(g.title)+'</span><strong>'+Math.round(Math.min(100,Number(g.saved)/Math.max(1,Number(g.target))*100))+'%</strong></div><div class="bar category-bar"><span style="width:'+Math.min(100,Number(g.saved)/Math.max(1,Number(g.target))*100)+'%"></span></div>').join(''):'<p class="muted">Pas encore d’objectif d’épargne.</p>')+'<p><button onclick="change(\'Épargne\')">Voir l’épargne →</button></p></section><section class="card wide"><h3>Évolution des revenus</h3>'+chart('income')+'</section><section class="card"><h3>Crédits & remboursements</h3><div class="summary-line"><span>Crédits actifs</span><strong>'+credits.filter(c=>Number(c.paid)<Number(c.total)).length+'</strong></div><div class="summary-line"><span>Restant dû</span><strong>'+money(debt)+'</strong></div><div class="summary-line"><span>Mensualités</span><strong>'+money(creditMonthly)+'</strong></div><button onclick="change(\'Crédits\')">Gérer les crédits →</button></section></div>'}function transactions(){return '<div class="grid"><div class="card"><h3>Nouvelle transaction</h3><form id="transaction"><label>Type</label><select name="type"><option value="expense">Dépense</option><option value="income">Revenu</option></select><label>Description</label><input name="title" required><label>Montant MAD</label><input name="amount" type="number" min=".01" step=".01" required><label>Catégorie</label><select name="category">'+['Salaire','Logement','Alimentation','Transport','Factures','Santé','Shopping','Autre'].map(x=>'<option>'+x+'</option>').join('')+'</select><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required><button class="primary">Ajouter</button></form></div><div class="card wide scroll"><h3>Historique</h3><table><tr><th>Date</th><th>Description</th><th>Catégorie</th><th>Montant</th><th></th></tr>'+data.transactions.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount)+'</td><td><button onclick="del(\''+x.id+'\')">×</button></td></tr>').join('')+'</table></div></div>'}function budget(){return '<div class="grid"><div class="card"><h3>Budgets mensuels (MAD)</h3><form id="budget">'+['Logement','Alimentation','Transport','Factures','Santé','Shopping','Autre'].map(c=>'<label>'+c+'</label><input type="number" min="0" name="'+c+'" value="'+(data.budgets[c]||0)+'">').join('')+'<button class="primary">Enregistrer</button></form></div><div class="card wide"><h3>Budget vs dépenses</h3>'+Object.entries(data.budgets).map(([c,b])=>{let used=data.transactions.filter(x=>x.category===c&&x.type==='expense'&&x.date.slice(0,7)===new Date().toISOString().slice(0,7)).reduce((s,x)=>s+Number(x.amount),0);return '<p>'+esc(c)+': '+money(used)+' / '+money(b)+'</p><div class="bar"><span style="width:'+Math.min(100,b?used/b*100:0)+'%"></span></div>'}).join('')+'</div></div>'}function savings(){return '<div class="grid"><div class="card"><h3>Objectif d’épargne</h3><form id="goal"><label>Nom</label><input name="title" required><label>Cible</label><input name="target" type="number" min="1" required><label>Épargné</label><input name="saved" type="number" min="0" value="0" required><button class="primary">Ajouter</button></form></div><div class="card wide"><h3>Mes objectifs</h3>'+data.goals.map(g=>'<p>'+esc(g.title)+' — '+money(g.saved)+' / '+money(g.target)+'</p><div class="bar"><span style="width:'+Math.min(100,g.saved/g.target*100)+'%"></span></div><p><button onclick="addSaving(\''+g.id+'\')">+ Épargner</button></p>').join('')+'</div></div>'}function credits(){let list=data.credits||[],total=list.reduce((a,c)=>a+Math.max(0,Number(c.total)-Number(c.paid)),0),monthly=list.reduce((a,c)=>a+Number(c.monthly||0),0);return '<div class="section-heading"><div><span class="eyebrow">FINORA / CREDIT CENTER</span><h2>Gestion des crédits</h2><p class="muted">Suivez vos prêts, mensualités et remboursements au même endroit.</p></div><span class="pill">✦ Suivi intelligent</span></div><div class="grid"><div class="card"><span class="muted">Capital restant</span><div class="value">'+money(total)+'</div></div><div class="card"><span class="muted">Mensualités prévues</span><div class="value">'+money(monthly)+'</div></div><div class="card"><span class="muted">Crédits actifs</span><div class="value">'+list.filter(c=>Number(c.paid)<Number(c.total)).length+'</div></div><div class="card"><h3>✦ Ajouter un crédit</h3><form id="credit"><label>Nom du crédit</label><input name="title" placeholder="Ex. Crédit voiture" required maxlength="100"><label>Montant total à rembourser (DH)</label><input type="number" name="total" min="1" step=".01" required><label>Déjà remboursé (DH)</label><input type="number" name="paid" min="0" step=".01" value="0" required><label>Mensualité (DH)</label><input type="number" name="monthly" min="0" step=".01" value="0" required><label>Prochaine échéance</label><input type="date" name="due"><button class="primary" type="submit">+ Ajouter le crédit</button></form></div><div class="card wide"><h3>◈ Mes crédits</h3>'+(list.length?list.map(c=>{let paid=Number(c.paid),amount=Number(c.total),pct=Math.min(100,Math.max(0,paid/amount*100));return '<div class="credit-item"><div class="two"><strong>'+esc(c.title)+'</strong><span class="pill">'+Math.round(pct)+'% remboursé</span></div><p class="muted">Restant : <strong>'+money(Math.max(0,amount-paid))+'</strong> · Mensualité : '+money(c.monthly)+'</p><div class="bar"><span style="width:'+pct+'%"></span></div><p class="muted">Échéance : '+esc(c.due||'Non définie')+'</p><div class="credit-actions"><button onclick="payCredit(\''+c.id+'\')">↗ Enregistrer paiement</button><button class="danger" onclick="removeCredit(\''+c.id+'\')">Supprimer</button></div></div>'}).join(''):'<div class="empty">Aucun crédit pour le moment. Ajoutez votre premier crédit à gauche.</div>')+'</div></div>'}function payCredit(id){let c=(data.credits||[]).find(x=>x.id===id);if(!c)return;let v=Number(prompt('Montant remboursé (DH)'));if(!Number.isFinite(v)||v<=0)return;let left=Number(c.total)-Number(c.paid);if(v>left)return msg('Le paiement dépasse le capital restant');c.paid=Number(c.paid)+v;save();msg('Paiement enregistré')}function removeCredit(id){if(confirm('Supprimer ce crédit ?')){data.credits=data.credits.filter(c=>c.id!==id);save()}}function reports(){return '<div class="card"><h3>Rapport financier</h3><p>Revenus: '+money(sum('income'))+'</p><p>Dépenses: '+money(sum('expense'))+'</p><p>Solde: '+money(sum('income')-sum('expense'))+'</p><button class="primary" onclick="print()">Exporter PDF</button> <button onclick="exportCSV()">Exporter Excel (CSV)</button></div>'}function account(){return '<div class="card" style="max-width:520px"><h3>Compte Supabase</h3>'+(user?'<p>'+esc(user.email)+'</p><button onclick="logout()">Déconnexion</button>':'<form id="auth"><label>Email</label><input type="email" name="email" required><label>Mot de passe</label><input type="password" name="password" minlength="6" required><button class="primary" name="mode" value="login">Connexion</button> <button name="mode" value="signup">Créer compte</button></form>')+'<p class="muted">Les données locales sont conservées sur cet appareil; la connexion synchronise avec votre compte.</p><button onclick="backup()">Télécharger une sauvegarde JSON</button><p><label>Importer une sauvegarde</label><input type="file" accept=".json,application/json" onchange="importBackup(this)"></p></div>'}function del(id){if(confirm('Supprimer?')){data.transactions=data.transactions.filter(x=>x.id!==id);save()}}function addSaving(id){let n=Number(prompt('Montant à ajouter'));if(n>0){data.goals.find(x=>x.id===id).saved+=n;save()}}async function logout(){await client.auth.signOut();user=null;render()}function exportCSV(){let csv='\ufeffDate;Type;Description;Categorie;Montant\n'+data.transactions.map(x=>[x.date,x.type,'"'+x.title.replaceAll('"','""')+'"',x.category,x.amount].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='finora-report.csv';a.click()}document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='transaction'){data.transactions.push({...v,id:crypto.randomUUID(),amount:Number(v.amount)});save()}if(f.id==='budget'){data.budgets=Object.fromEntries(Object.entries(v).map(([k,n])=>[k,Number(n)]));save()}if(f.id==='credit'){if(Number(v.paid)>Number(v.total)){msg('Le montant remboursé ne peut pas dépasser le total');return}data.credits??=[];data.credits.push({id:crypto.randomUUID(),title:v.title,total:Number(v.total),paid:Number(v.paid),monthly:Number(v.monthly),due:v.due});save();msg('Crédit ajouté')}if(f.id==='goal'){data.goals.push({id:crypto.randomUUID(),title:v.title,target:Number(v.target),saved:Number(v.saved)});save()}if(f.id==='auth'){try{let r=e.submitter.value==='signup'?await client.auth.signUp({email:v.email,password:v.password}):await client.auth.signInWithPassword({email:v.email,password:v.password});if(r.error)throw r.error;if(r.data.session){user=r.data.user;await load()}else msg('Confirme ton email avant de te connecter')}catch(err){msg(err.message)}}});render();if(client)client.auth.getUser().then(async r=>{if(r.data.user){user=r.data.user;await load()}});</script></html>
